[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "praya-bench"
version = "0.3.0"
description = "A visual benchmark for AI building in Minecraft"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "prayabench contributors"}]
dependencies = []
classifiers = ["Development Status :: 3 - Alpha", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3"]

[project.scripts]
prayabench = "prayabench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
